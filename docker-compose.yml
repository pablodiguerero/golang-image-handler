services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      application:
        condition: service_healthy
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./data/cache:/cache:ro"
    ports:
      - "8000:80"

  application:
    build:
      dockerfile: Dockerfile
      context: .
    volumes:
      - "./data/media:/images:ro"
      - "./data/cache:/cache"
    ports:
      - "8001:80"
    environment:
      APP_ALLOW_AVIF: "1"
      APP_ALLOW_WEBP: "1"
      APP_IMAGE_ROOT: /images
      APP_IMAGE_CACHE: /cache
      APP_ACCEL_REDIRECT_PREFIX: /__image_cache
