user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Managed by Nginx itself: inactive entries expire after a week and its cache
  # manager evicts least-recently-used entries when the volume reaches 5 GiB.
  proxy_cache_path /var/cache/nginx/image-handler levels=1:2 keys_zone=image_handler:20m inactive=7d max_size=5g use_temp_path=off;

  upstream image_handler {
    server application:80;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Internal redirect emitted only after the application atomically writes a
    # cached result. Nginx sends the file with sendfile(), avoiding a second
    # copy through the Go process.
    location /__image_cache/ {
      internal;
      alias /cache/;
      add_header X-Content-Type-Options nosniff always;
      add_header Vary Accept always;
    }

    location / {
      proxy_pass http://image_handler;
      proxy_http_version 1.1;
      proxy_cache image_handler;
      proxy_cache_key "$scheme$proxy_host$request_uri$http_accept";
      proxy_cache_valid 200 1h;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
